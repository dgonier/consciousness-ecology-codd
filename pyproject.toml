[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trophic"
version = "0.0.1"
description = "Trophic multi-agent system — fintech v1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.43",
    "boto3>=1.34",
    "tenacity>=8.2",
    "chronos-forecasting>=1.4",
]

[project.optional-dependencies]
# Multi-family apex voter SDKs (gpt-5, gemini, anthropic-via-bedrock).
# Bedrock comes from boto3 (already in core deps); these add OpenAI +
# Google. Anthropic public-API SDK isn't needed since we route through
# Bedrock by default.
voters = [
    "openai>=2.0",
    "google-genai>=1.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trophic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
