# ───── POLYMARKET-BOUND STATE BELIEFS ─────
# These state beliefs are bound to specific live Polymarket markets via
# polymarket_market_id. While the market is open, current_p reads through
# from the market price. On resolution, snaps to 0/1 and propagates.
#
# Listed below as belief→link pairs: each entry is the bound state belief
# and the link from that belief to the appropriate market-level conclusion.
# The market_id slugs are placeholders; bind to live markets at wire time.

- id: belief.macro.fed_cuts_by_july_2026
