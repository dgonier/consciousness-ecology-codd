# Internal links — v0 seed inventory
# ~25 hand-written internal links across the three scopes.
# Each is unverified at start; validation phase tests them against Polygon
# scenarios with known outcomes before any are trusted in production.
#
# Naming convention:
#   link.<scope>.<premise_short>→<conclusion_short>
#   belief.<scope>.<statement_id>[.<context>]
#
# direction: positive = premise_p increases → conclusion_p increases
#            negative = premise_p increases → conclusion_p decreases
#
# strength_prior: subjective starting weight [0, 1]. Scaled toward
# strength_posterior by validation phase. 0.7 = "I'd be surprised if this
# link doesn't hold most of the time."

