# ───── Cross-correlation links into existing market/outcome layer ─────
# When a cluster is high-correlation, evidence about ANY member is
# stronger evidence about the whole cluster's direction. We model this by
# linking cluster_high beliefs to equity_pressure/risk premium beliefs:
# a cohesive cluster amplifies macro signal flow into its members.

- id: link.cluster_tech_high→equity_amplification
  premise_belief_id: belief.market.cluster_correlation_tech_high
  conclusion_belief_id: belief.market.us_equity_pressure_up
  scope: market
  direction: positive
  strength_prior: 0.30
  citation: "When tech cluster is cohesive, macro pressure transmits more uniformly into equity"

- id: link.dispersion_high→single_stock_alpha
  premise_belief_id: belief.market.cross_asset_dispersion_high
  conclusion_belief_id: belief.market.equity_risk_premium_up
  scope: market
  direction: negative  # high dispersion → less systemic risk → mild risk-premium compression
  strength_prior: 0.25
  citation: "High dispersion = single-stock alpha environment, slight risk-premium compression"

- id: link.cluster_consumer_staples_high→defensive_rotation
  premise_belief_id: belief.market.cluster_correlation_consumer_staples_high
  conclusion_belief_id: belief.market.equity_risk_premium_up
  scope: market
  direction: positive
  strength_prior: 0.40
  citation: "Defensive cluster cohesion historically signals risk-off rotation"
