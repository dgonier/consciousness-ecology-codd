# ───── CROSS-CORRELATION beliefs (emitted by cross_correlation herbivore) ─────
# Pure-numeric species — no LLM. Activates these market-scope beliefs based
# on rolling correlation matrix structure over the watchlist universe.
# See trophic/beliefs/herbivores/cross_correlation.py for emission logic.

# Cluster regime beliefs — one pair (high / low) per defined cluster.
# "_high" = cluster moving as one unit; "_low" = cluster has broken / dispersed.
# Both lean neutral as priors — these describe regime, not direction.

- id: belief.market.cluster_correlation_tech_high
  kind: state_belief
  statement_template: "Tech cluster (AAPL/MSFT/GOOG/AVGO/CSCO/AMZN) is moving as a single unit (intra-corr ≥ 0.40)"
  scope: market
  prior_p: 0.40
  decay_class: normal
  citation: "Cluster-cohesion regime detector (cross_correlation herb)"

